# مثال Nginx / OpenResty — InfinityFree يستخدم Apache (.htaccess)
# انسخ داخل server { ... } إن كان لديك VPS

# السماح لزواحف البحث
# map $http_user_agent $is_search_bot {
#   default 0;
#   ~*(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot) 1;
# }

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://generativelanguage.googleapis.com https://challenges.cloudflare.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://challenges.cloudflare.com; connect-src 'self' https://generativelanguage.googleapis.com https://api-inference.huggingface.co;" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

